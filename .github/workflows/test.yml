name: Analytic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/KspContinuum.Tests -c Release
      - run: dotnet run --project src/KspContinuum.Mission/Tests/Mission.Tests.csproj -c Release
