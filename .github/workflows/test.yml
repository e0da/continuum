name: Analytic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ksp-continuum-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: e0da/actions/.github/workflows/ci-baseline.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: ksp-continuum-linux-arm64
    permissions:
      contents: read
      pull-requests: read
      statuses: write

  portable:
    uses: e0da/actions/.github/workflows/ci-command.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: ksp-continuum-linux-arm64
      dotnet-version: "8.0.x"
      python-version: "3.11"
      command: scripts/check portable

  field:
    uses: e0da/actions/.github/workflows/ci-command.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: ksp-continuum-linux-arm64
      python-version: "3.11"
      command: scripts/check field

  structural:
    uses: e0da/actions/.github/workflows/ci-command.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: ksp-continuum-linux-arm64
      system-deps: cmake build-essential ninja-build python3
      command: scripts/check structural

  hosted-drift:
    uses: e0da/actions/.github/workflows/hosted-drift-report.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: ksp-continuum-linux-arm64
      mode: enforce
