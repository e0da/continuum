name: Analytic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ksp-continuum-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: e0da/actions/.github/workflows/ci-baseline.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: continuum-linux-arm64
    permissions:
      contents: read
      pull-requests: read
      statuses: write

  portable:
    uses: e0da/actions/.github/workflows/ci-command.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: continuum-linux-arm64
      dotnet-version: "8.0.x"
      command: cargo run --manifest-path tools/xtask/Cargo.toml -- portable

  field:
    uses: e0da/actions/.github/workflows/ci-command.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: continuum-linux-arm64
      command: cargo run --manifest-path tools/xtask/Cargo.toml -- field

  structural:
    uses: e0da/actions/.github/workflows/ci-command.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: continuum-linux-arm64
      system-deps: cmake build-essential ninja-build
      command: cargo run --manifest-path tools/xtask/Cargo.toml -- structural

  hosted-drift:
    uses: e0da/actions/.github/workflows/hosted-drift-report.yml@6b25329eb695f788cf91749877be77b28c8f815a
    with:
      runner: continuum-linux-arm64
      mode: enforce
